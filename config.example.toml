# Copy this reference into the private configuration generated by `wecom-inbox init`.
# Keep the generated random admin token. This file intentionally contains no valid credentials.
data_dir = "./data"
listen = "127.0.0.1:8787"
admin_token = "REPLACE_WITH_A_RANDOM_TOKEN_OF_32_OR_MORE_CHARACTERS"
max_file_mb = 50
# public_url = "https://inbox.example.com" # HTTPS reverse-proxy origin

[[bots]]
id = "YOUR_BOT_ID"
name = "Business inbox"
secret = "YOUR_BOT_SECRET"
enabled = false
receipt = true
allowed_users = ["YOUR_WECOM_USER_ID"]
allowed_chats = []
# Use ["*"] only if you intentionally authorize everyone who can contact this Bot.

[[consumers]]
id = "document-worker"
url = "https://worker.example.com/inbox"
secret = "REPLACE_WITH_A_SEPARATE_RANDOM_WEBHOOK_SIGNING_SECRET"
token = "REPLACE_WITH_A_SEPARATE_RANDOM_API_ACCESS_TOKEN"
bots = ["YOUR_BOT_ID"]
allow_reply = false
allow_private_network = false
# A local HTTP worker requires allow_private_network=true. It permits private destinations.
# Omit url and secret for a pull-only consumer that queries the HTTP API.
